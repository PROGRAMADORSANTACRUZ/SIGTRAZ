version: '3.8'

# IMPORTANTE: este compose NO crea un contenedor de base de datos propio.
# La base de datos real de SIGTRAZ ya existe como un recurso separado en
# Dokploy (con datos de produccion) — NUNCA agregar aqui un servicio "db"
# nuevo, o el backend podria terminar conectado a una base vacia distinta.
# Backend y frontend se unen a la red externa DOKPLOY_NETWORK (por defecto
# "dokploy-network") para poder alcanzar ese recurso de base de datos ya
# existente por su hostname interno (el mismo que usa la app actual en la
# pestana Environment de Dokploy: DB_HOST, DB_PORT, DB_USER, DB_PASSWORD,
# DB_DATABASE).

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sigtraz-api
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://sigtraz.grupo-santacruz.com}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      SEED_PASSWORD: ${SEED_PASSWORD}
    ports:
      - "${API_PORT:-4000}:4000"
    networks:
      - sigtraz-network
      - dokploy-network
    restart: unless-stopped
    labels:
      - "dokploy.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.sigtraz-api.rule=Host(`sigtraz.grupo-santacruz.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.sigtraz-api.entrypoints=websecure"
      - "traefik.http.routers.sigtraz-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.sigtraz-api.loadbalancer.server.port=4000"

  # Frontend Web App
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://sigtraz.grupo-santacruz.com/api}
    container_name: sigtraz-web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - sigtraz-network
    restart: unless-stopped
    labels:
      - "dokploy.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.sigtraz.rule=Host(`sigtraz.grupo-santacruz.com`)"
      - "traefik.http.routers.sigtraz.entrypoints=websecure"
      - "traefik.http.routers.sigtraz.tls.certresolver=letsencrypt"
      - "traefik.http.services.sigtraz.loadbalancer.server.port=80"
      - "traefik.http.middlewares.sigtraz-redirectslash.redirectregex.regex=^(https?://[^/]+)$$"
      - "traefik.http.middlewares.sigtraz-redirectslash.redirectregex.replacement=$${1}/"
      - "traefik.http.routers.sigtraz.middlewares=sigtraz-redirectslash"

networks:
  sigtraz-network:
    driver: bridge
  dokploy-network:
    external: true
